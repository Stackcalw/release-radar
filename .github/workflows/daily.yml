name: Daily forecast

on:
  schedule:
    - cron: "15 7 * * *" # 07:15 UTC every day
  workflow_dispatch:

permissions:
  contents: write # commit the day's data back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch signals, refit and rebuild the page
        run: python3 radar.py run

      - name: Save the day's data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Daily data $(date -u +%F)"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
